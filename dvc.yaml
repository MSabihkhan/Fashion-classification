stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw/fashion_mnist.npz

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/fashion_mnist.npz
    params:
      - preprocess.test_size
      - preprocess.seed
    outs:
      - data/processed/fashion_mnist_processed.npz

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/fashion_mnist_processed.npz
    params:
      - train.dense_units
      - train.dropout_rate
      - train.learning_rate
      - train.epochs
      - train.batch_size
    outs:
      - models/model.h5
      - models/history.csv

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.h5
      - data/processed/fashion_mnist_processed.npz
    outs:
      - models/confusion_matrix.png
    metrics:
      - metrics.json:
          cache: false